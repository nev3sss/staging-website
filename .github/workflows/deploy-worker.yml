name: Deploy — Worker (API)

on:
  push:
    branches: [main]
    paths: ["workers/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options: ["staging", "production"]

# Least-privilege permissions for Worker deploy.
permissions:
  contents: read
  deployments: write

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        run: |
          # Push to main (no env input) → deploy to top-level (production)
          # workflow_dispatch env=staging → --env staging
          # workflow_dispatch env=production → deploy top-level (no --env flag)
          if [[ "${{ github.event.inputs.env }}" == "staging" ]]; then
            npx wrangler deploy --env staging
          else
            npx wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # D1 migrations run only on production (no env = push to main,
      # or explicit workflow_dispatch env=production).
      # NOT on every push — migrations are irreversible.
      - name: Run D1 migrations (production only)
        if: github.event.inputs.env == '' || github.event.inputs.env == 'production'
        run: npx wrangler d1 migrations apply nev3s-dealership-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
